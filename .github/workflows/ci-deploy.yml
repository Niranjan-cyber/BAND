# Push to main -> vercel pull/build/deploy (single project: FastAPI backend + static frontend,
# same-origin) -> smoke test on the public URL.
#
# Commands verified against Vercel's docs on 2026-09-29 (references/deploy-pipelines.md #4);
# re-check before relying on this after that date, flags/actions drift.
#
# Required repo secrets (see RUNBOOK.md "Deploy" for how to get these):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: ci-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend unit tests (placeholder until real tests exist)
        run: |
          pip install -r requirements.txt
          python -c "from backend.main import app; assert app"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (prebuilt output)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "public_url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Smoke test golden path on public URL
        env:
          PUBLIC_URL: ${{ steps.deploy.outputs.public_url }}
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
          npx playwright test tests/smoke
