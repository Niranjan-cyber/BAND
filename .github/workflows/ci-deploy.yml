# Push to main -> Vercel's GitHub integration auto-deploys (no CLI, no VERCEL_TOKEN) ->
# CI waits for that deployment via GitHub's own Deployments API -> smoke test on the public URL.
#
# Prerequisite (one-time, dashboard): import this repo into Vercel via its GitHub integration
# (vercel.com/new -> Import Git Repository) and set the Production Branch to `main`. See
# RUNBOOK.md "Deploy". We switched to this from CLI-token deploys because Claude Code's Vercel
# login is scoped and can't create personal tokens (references/deploy-pipelines.md #4 still
# documents the CLI-token path as a fallback if you get a token another way).
#
# vercel/wait-for-deployment-action pinned to a commit SHA (2026-05-21) verified via
# github.com/vercel/wait-for-deployment-action on 2026-09-29; re-check before trusting after that.
name: ci-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
  statuses: read
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend unit tests (placeholder until real tests exist)
        run: |
          pip install -r requirements.txt
          python -c "from backend.main import app; assert app"

      - name: Wait for Vercel deployment
        id: deployment
        uses: vercel/wait-for-deployment-action@0e2b0c5c5cce31f1648108aeec56467187aca037
        with:
          environment: production
          timeout: "600"

      - name: Smoke test golden path on public URL
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
          npx playwright test tests/smoke
